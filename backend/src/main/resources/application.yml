server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: ai-inter-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_interview?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:ai_interview}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${APP_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:11MB}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
app:
  jwt-secret: ${APP_JWT_SECRET:}
  token-ttl: ${APP_TOKEN_TTL:PT2H}
  storage-root: ${APP_STORAGE_ROOT:./var/private-files}
  max-upload-bytes: ${APP_MAX_UPLOAD_BYTES:10485760}
  allowed-extensions: ${APP_ALLOWED_EXTENSIONS:pdf,doc,docx}
  max-text-chars: ${APP_MAX_TEXT_CHARS:200000}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
logging:
  level:
    org.apache.pdfbox: OFF
    org.apache.fontbox: OFF
    org.apache.poi: OFF
training:
  audio-dir: ${TRAINING_AUDIO_DIR:${app.storage-root}/training-audio}
  evaluation-timeout-ms: ${TRAINING_EVALUATION_TIMEOUT_MS:8000}
  speech:
    provider: ${TRAINING_SPEECH_PROVIDER:none}
    isi-access-key-id: ${TRAINING_ISI_ACCESS_KEY_ID:}
    isi-access-key-secret: ${TRAINING_ISI_ACCESS_KEY_SECRET:}
    isi-app-key: ${TRAINING_ISI_APP_KEY:}
    isi-region: ${TRAINING_ISI_REGION:cn-shanghai}
    ffmpeg-path: ${TRAINING_FFMPEG_PATH:ffmpeg}
---
spring:
  config:
    activate:
      on-profile: '!demo & !test'
    import: optional:file:./backend/config/local/application.yml
