server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: ai-inter-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_interview?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:ai_interview}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${APP_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:11MB}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
app:
  jwt-secret: ${APP_JWT_SECRET:}
  token-ttl: ${APP_TOKEN_TTL:PT2H}
  storage-root: ${APP_STORAGE_ROOT:./var/private-files}
  max-upload-bytes: ${APP_MAX_UPLOAD_BYTES:10485760}
  allowed-extensions: ${APP_ALLOWED_EXTENSIONS:pdf,doc,docx}
  max-text-chars: ${APP_MAX_TEXT_CHARS:200000}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
logging:
  level:
    org.apache.pdfbox: OFF
    org.apache.fontbox: OFF
    org.apache.poi: OFF
